# Словарь терминов стайлгайда ДелоТрек (раздел «Словарь и глоссарий», ГЛ-1).
# Линтер предлагает замену и умеет исправлять её автоматически: npm run lint:fix
version: 1
rules:
  # Буква «ё» (ОП-1)
  - expected: ещё
    pattern: '/(?<![А-Яа-яЁё])еще(?![А-Яа-яЁё])/'
  - expected: Ещё
    pattern: '/(?<![А-Яа-яЁё])Еще(?![А-Яа-яЁё])/'
  - expected: её
    pattern: '/(?<![А-Яа-яЁё])ее(?![А-Яа-яЁё])/'
  - expected: всё равно
    pattern: '/(?<![А-Яа-яЁё])все равно(?![А-Яа-яЁё])/'
  - expected: отчёт$1
    pattern: '/(?<![А-Яа-яЁё])отчет(а|у|ом|е|ы|ов|ам|ами|ах)?(?![А-Яа-яЁё])/'
  - expected: объём$1
    pattern: '/(?<![А-Яа-яЁё])объем(а|у|ом|е|ы|ов)?(?![А-Яа-яЁё])/'

  # Термины и англицизмы (ГЛ-1)
  - expected: нажмите
    pattern: '/(?<![А-Яа-яЁё])кликните(?: по кнопке| на кнопку)?(?![А-Яа-яЁё])/'
  - expected: Нажмите
    pattern: '/(?<![А-Яа-яЁё])Кликните(?: по кнопке| на кнопку)?(?![А-Яа-яЁё])/'
  - expected: нажать
    pattern: '/(?<![А-Яа-яЁё])кликнуть(?![А-Яа-яЁё])/'
  - expected: электронная почта
    pattern: '/(?<![\wА-Яа-яЁё-])(?:[Ee]-?mail|имейл|емейл|е-мейл)(?![\wА-Яа-яЁё])/'
  - expected: сайт
    pattern: '/(?<![А-Яа-яЁё])вебсайт(?![А-Яа-яЁё])/'

  # Названия продуктов и технологий (ГЛ-1)
  - expected: GitHub
    pattern: '/(?<![\w./-])(?:Github|github|гитхаб|Гитхаб)(?![\w.])/'
  - expected: JavaScript
    pattern: '/(?<![\w./-])(?:Javascript|javascript)(?![\w.])/'
  - expected: Markdown
    pattern: '/(?<![\w./-])(?:markdown|маркдаун|Маркдаун)(?![\w.])/'
  - expected: MkDocs
    pattern: '/(?<![\w./-])Mkdocs(?![\w.])/'
  - expected: ДелоТрек
    pattern: '/(?<![А-Яа-яЁё])(?:Делотрек|Дело-трек|Дело-Трек)(?![А-Яа-яЁё])/'
